<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a73e8" />
  <title>Карта Бангкока · офлайн</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Top bar -->
  <div id="topbar">
    <div class="search-wrap">
      <span class="mi">🔍</span>
      <input id="search" type="search" placeholder="Поиск места…" autocomplete="off" />
      <button id="locateBtn" title="Где я">📍</button>
    </div>
    <div id="dateChips" class="date-chips"></div>
  </div>

  <!-- Map controls -->
  <div id="mapctl">
    <button id="mapBtn" title="Детальная карта (нужен интернет)">🗺️</button>
    <button id="fitBtn" title="Показать все">⊚</button>
  </div>

  <!-- Bottom sheet -->
  <div id="sheet" class="sheet">
    <div class="sheet-grip" id="grip"></div>
    <nav class="tabs">
      <button class="tab active" data-tab="routes">Маршруты</button>
      <button class="tab" data-tab="places">Места</button>
      <button class="tab" data-tab="plan">План</button>
      <button class="tab" data-tab="fav">★</button>
    </nav>
    <div class="sheet-body">
      <section id="tab-routes" class="tabpane active"></section>
      <section id="tab-places" class="tabpane">
        <div id="catFilters" class="cat-filters"></div>
        <div id="placeList" class="list"></div>
      </section>
      <section id="tab-plan" class="tabpane"></section>
      <section id="tab-fav" class="tabpane"></section>
    </div>
  </div>

  <!-- Detail / route / taxi overlays -->
  <div id="overlay" class="overlay hidden"><div id="overlayCard" class="overlay-card"></div></div>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="data/places.js"></script>
  <script src="data/transit.js"></script>
  <script src="data/basemap.js"></script>
  <script src="data/themes.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
